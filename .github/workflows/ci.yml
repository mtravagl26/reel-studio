name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Added by By Mel Ross: the reel editor's tests use ffmpeg and python3 (they skip what is missing).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      # Added by By Mel Ross: the review and touch-ups pages in headless Chrome (skips itself if Chrome is missing).
      - name: Pages in a real browser
        run: CHROME="$(command -v google-chrome || command -v chromium-browser || echo none)" node tests/test_review_ui.mjs
      - run: npm run validate
      - name: Validate the Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.284 plugin validate --strict .
